name: QA — FalaPro
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Iniciar servidor de testes
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/falapro.log 2>&1 &
      - name: Browser E2E e auditoria visual
        run: npm run test:e2e
      - name: Screenshots e relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falapro-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
